# This is a workflow to compile the cdeps source without cime
name: extbuild
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'feature/**' ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-cdeps:
    runs-on: ubuntu-latest
    env:
      CC: mpicc
      FC: mpifort
      CXX: mpicxx
      CPPFLAGS: "-I/usr/include -I/usr/local/include "
      LDFLAGS: "-L/usr/lib/x86_64-linux-gnu "
      # Versions of all dependencies can be updated here - these match tag names in the github repo
      ESMF_VERSION: v8.6.1
      ParallelIO_VERSION: pio2_6_2
    steps:
      - id: checkout-CDEPS
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache EXTERNALS
        id: cache-EXTERNALS
        uses: actions/cache@v4
        with:
          path: |
            fox
            share/genf90
          key: ${{ runner.os }}-externals-${{ hashFiles('Externals_CDEPS.cfg') }}
      - id: checkout-externals
        if: steps.cache-EXTERNALS.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ESMCI/manage_externals
          ./manage_externals/checkout_externals -e Externals_CDEPS.cfg
      - id: load-env
        run: |
          sudo apt-get update
          sudo apt-get install gfortran
          sudo apt-get install wget
          sudo apt-get install openmpi-bin libopenmpi-dev
          sudo apt-get install netcdf-bin libnetcdf-dev libnetcdff-dev
          sudo apt-get install pnetcdf-bin libpnetcdf-dev
          sudo apt-get install autotools-dev autoconf
      - name: Cache PARALLELIO
        id: cache-PARALLELIO
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pio
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ParallelIO_VERSION }}-pio-v4
      - name: Build ParallelIO
        if: steps.cache-PARALLELIO.outputs.cache-hit != 'true'
        uses: NCAR/ParallelIO/.github/actions/parallelio_cmake@9390e30e29d4ebbfbef0fc72162cacd9e8f25e4e
        with:
          parallelio_version: ${{ env.ParallelIO_VERSION }}
          enable_fortran: True
          install_prefix: ${{ github.workspace }}/pio
      - name: Install ESMF
        uses: esmf-org/install-esmf-action@v1
        id: install-esmf
        env:
          ESMF_COMPILER: gfortran
          ESMF_BOPT: g
          ESMF_COMM: openmpi
          ESMF_NETCDF: nc-config
          ESMF_PNETCDF: pnetcdf-config
          ESMF_INSTALL_PREFIX: ${{ github.workspace }}/ESMF
          ESMF_PIO: external
          ESMF_PIO_INCLUDE: ${{ github.workspace }}/pio/include
          ESMF_PIO_LIBPATH: ${{ github.workspace }}/pio/lib
        with:
          version: ${{ env.ESMF_VERSION }}
          esmpy: false
          cache: true
      
      - name: Build CDEPS
        uses: ./.github/actions/buildcdeps
        with:
          esmfmkfile: ${{ env.ESMFMKFILE }}
          pio_path: ${{ github.workspace }}/pio
          src_root: ${{ github.workspace }}
          cmake_flags: " -Wno-dev -DCMAKE_BUILD_TYPE=DEBUG -DWERROR=ON  -DCMAKE_Fortran_FLAGS=\"-DCPRGNU -g -Wall \
          -ffree-form -ffree-line-length-none -fallow-argument-mismatch \""
      - name: Test CDEPS
        run: |
          cd build-cdeps
          make VERBOSE=1